<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مینی اپ کازینو</title>
    <!-- اتصال به SDK تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🎰 به مینی اپ خوش آمدید</h1>
    <p id="user-name">در حال بارگذاری...</p>
    <button id="start-game">شروع بازی</button>

    <script>
        // آماده‌سازی مینی اپ
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // تمام صفحه شود

        // نمایش نام کاربر
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = `سلام ${user.first_name} عزیز! 👋`;
        } else {
            document.getElementById('user-name').innerText = 'کاربر مهمان';
        }

        // دکمه شروع بازی
        document.getElementById('start-game').addEventListener('click', () => {
            tg.showAlert('بازی به زودی اضافه می‌شود!');
        });
    </script>
</body>
</html>
